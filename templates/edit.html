{% extends "base.html" %}
{% block title %}Редактировать: {{ product.name }}{% endblock %}
{% block content %}
<div class="card animate-fade-in">
    <div class="card-header"><h4 class="mb-0"><i class="bi bi-pencil"></i> Редактирование: {{ product.name }}</h4></div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            <div class="row">
                <div class="col-md-8">
                    <div class="mb-3">
                        <label class="form-label">Название *</label>
                        <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Категория *</label>
                            <input type="text" name="category" class="form-control" value="{{ product.category }}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Количество *</label>
                            <input type="number" name="quantity" class="form-control" min="0" value="{{ product.quantity }}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Цена (₽) *</label>
                            <input type="number" name="price" class="form-control" min="0" step="0.01" value="{{ product.price }}" required>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label">Фото товара</label>
                        {% if product.image_path %}
                            <img src="{{ url_for('static', filename=product.image_path) }}" 
                                 style="max-width: 100%; border-radius: 8px; margin-bottom: 10px;">
                        {% endif %}
                        <input type="file" name="image" class="form-control" accept="image/*"
                               onchange="previewImage(this, 'imagePreview')">
                        <img id="imagePreview" style="display: none; max-width: 100%; margin-top: 10px; border-radius: 8px;">
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-warning"><i class="bi bi-save"></i> Сохранить</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
